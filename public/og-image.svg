<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCF33"/>
      <stop offset="50%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#B8960F"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Gold corner accents -->
  <rect x="40" y="40" width="100" height="4" fill="#D4AF37"/>
  <rect x="40" y="40" width="4" height="100" fill="#D4AF37"/>
  <rect x="1060" y="40" width="100" height="4" fill="#D4AF37"/>
  <rect x="1156" y="40" width="4" height="100" fill="#D4AF37"/>
  <rect x="40" y="586" width="100" height="4" fill="#D4AF37"/>
  <rect x="40" y="490" width="4" height="100" fill="#D4AF37"/>
  <rect x="1060" y="586" width="100" height="4" fill="#D4AF37"/>
  <rect x="1156" y="490" width="4" height="100" fill="#D4AF37"/>

  <!-- Dollar signs background pattern -->
  <g opacity="0.05" fill="#D4AF37">
    <text x="100" y="200" font-family="Georgia, serif" font-size="80">$</text>
    <text x="300" y="400" font-family="Georgia, serif" font-size="60">$</text>
    <text x="900" y="180" font-family="Georgia, serif" font-size="70">$</text>
    <text x="1000" y="500" font-family="Georgia, serif" font-size="90">$</text>
    <text x="150" y="550" font-family="Georgia, serif" font-size="50">$</text>
  </g>

  <!-- Main title "Money" -->
  <text x="600" y="280" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Money</text>

  <!-- Main title "Talks" with gold gradient -->
  <text x="600" y="400" font-family="Georgia, serif" font-size="120" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle">Talks</text>

  <!-- Tagline -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="28" fill="#9CA3AF" text-anchor="middle" letter-spacing="8">LUXURY HANDCRAFTED FRAMES</text>

  <!-- Gold line separator -->
  <rect x="400" y="510" width="400" height="2" fill="url(#goldGrad)"/>

  <!-- Website -->
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="22" fill="#D4AF37" text-anchor="middle">@money.talks.georgia</text>
</svg>
